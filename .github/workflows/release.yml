name: release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
            target: linux-x86_64
          - os: macos-15
            architecture: arm64
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify host and release version
        run: |
          test "$(uname -m)" = '${{ matrix.architecture }}'
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import package; assert "v" + package.version() == sys.argv[1]' "$GITHUB_REF_NAME"
      - name: Install checksum-verified Zig
        run: |
          toolchain=$(bash scripts/install-zig.sh "$RUNNER_TEMP/zigagent-toolchains")
          echo "$toolchain" >> "$GITHUB_PATH"
      - run: bash scripts/accept.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The parent creates a tag only after both-host live and skeptic gates.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: python3 scripts/package.py manifest --all
      - name: Attach both native archives and combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md dist/*.tar.gz dist/SHA256SUMS
